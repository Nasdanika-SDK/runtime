<form novalidate>
  <div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" class="form-control" type="email" required placeholder="name@example.com"><div class="invalid-feedback">Enter an email</div></div>
  <div>
    <div class="form-check form-switch"><input id="dark" class="form-check-input" type="checkbox" role="switch" checked><label class="form-check-label" for="dark">Dark mode</label></div>
    <div class="form-floating"><input id="city" class="form-control" type="text" placeholder="City"><label for="city">City</label></div>
    <select class="form-select" name="color">
      <option value="red">Red</option>
    </select>
  </div>
</form>
