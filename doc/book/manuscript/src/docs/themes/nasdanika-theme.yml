# Nasdanika SDK Runtime book theme for Asciidoctor PDF.
#
# Trim size 7 x 9.25 inches, the size of the Addison-Wesley technical books such as the EMF book.
# Body in Noto Serif, headings in Noto Sans, code in M+ 1mn: all bundled with Asciidoctor PDF and
# licensed under the SIL Open Font License, so the PDF can be distributed with the fonts embedded.
#
# Colors come from the Nasdanika SDK logo: the blue and the black of the circle.
#
# media=screen (the default build) uses symmetric margins and no blank pages. media=prepress
# (-Dbook.media=prepress) mirrors the margins and starts chapters on recto pages, for print.
extends: default
font:
  catalog:
    merge: true
    Noto Sans:
      normal: GEM_FONTS_DIR/notosans-regular-subset.ttf
      bold: GEM_FONTS_DIR/notosans-bold-subset.ttf
      italic: GEM_FONTS_DIR/notosans-italic-subset.ttf
      bold_italic: GEM_FONTS_DIR/notosans-bold_italic-subset.ttf
  fallbacks: []
brand:
  blue: 1B8EC6
  deep: 0F4C6E
  ink: 222222
  muted: 6B7780
  wash: F2F7FA
page:
  size: [7in, 9.25in]
  margin: [0.7in, 0.75in, 0.7in, 0.75in]
  margin_inner: 0.875in
  margin_outer: 0.625in
base:
  font_family: Noto Serif
  font_color: $brand_ink
  font_size: 10
  line_height_length: 13.5
  line_height: $base_line_height_length / $base_font_size
  text_align: justify
  font_size_large: 12.5
  font_size_small: 8.5
vertical_rhythm: 11
horizontal_rhythm: 11
link:
  font_color: 17709E
codespan:
  font_color: 7A1F3D
  font_size: 0.92em
heading:
  font_family: Noto Sans
  font_color: $brand_deep
  font_style: bold
  h1_font_size: 26
  h2_font_size: 21
  h3_font_size: 14.5
  h4_font_size: 12
  h5_font_size: 10.5
  h6_font_size: 10
  line_height: 1.15
  margin_top: $vertical_rhythm * 0.9
  margin_bottom: $vertical_rhythm * 0.6
  min_height_after: $base_line_height_length * 3
  h2:
    font_color: $brand_blue
  h3:
    margin_top: $vertical_rhythm * 1.2
chapter:
  break_before: always
part:
  break_after: always
title_page:
  text_align: left
  logo:
    top: 8%
    align: left
  title:
    top: 42%
    font_family: Noto Sans
    font_size: 30
    font_color: $brand_deep
    line_height: 1.1
  subtitle:
    font_family: Noto Sans
    font_size: 13
    font_style: normal
    font_color: $brand_blue
    line_height: 1.3
    margin_top: 10
  authors:
    margin_top: 36
    font_size: 13
    font_color: $brand_ink
  revision:
    margin_top: 8
    font_size: 9.5
    font_color: $brand_muted
caption:
  font_family: Noto Sans
  font_size: 8.5
  font_style: italic
  font_color: $brand_muted
code:
  font_family: M+ 1mn
  font_size: 7.8
  line_height: 1.2
  padding: [7, 9, 7, 9]
  background_color: $brand_wash
  border_color: D3E2EB
  border_radius: 2
  border_width: 0.5
  border_left_width: 2.5
  border_left_color: $brand_blue
conum:
  font_color: $brand_blue
  font_size: 9
admonition:
  column_rule_color: D3E2EB
  column_rule_width: 1
  padding: [3, 10, 3, 10]
  icon:
    note:
      name: fas-info-circle
      stroke_color: $brand_blue
      size: 20
    tip:
      name: fas-lightbulb
      stroke_color: 2E8B57
      size: 20
    important:
      # Editor's notes for the author: [IMPORTANT,caption="Editor's note"]
      name: fas-pen-nib
      stroke_color: D97706
      size: 20
    caution:
      name: fas-exclamation-triangle
      stroke_color: B45309
      size: 20
    warning:
      name: fas-exclamation-circle
      stroke_color: B91C1C
      size: 20
sidebar:
  background_color: $brand_wash
  border_color: D3E2EB
  border_width: 0.5
  border_radius: 2
  padding: [10, 12, 10, 12]
  title:
    font_family: Noto Sans
    font_color: $brand_deep
    font_size: 10.5
    text_align: left
quote:
  font_size: 10.5
  font_color: 444444
  border_left_color: $brand_blue
  border_left_width: 2
  cite:
    font_color: $brand_muted
table:
  font_size: 9
  border_color: D3E2EB
  grid_color: D3E2EB
  cell_padding: [3, 5, 3, 5]
  head:
    font_family: Noto Sans
    font_style: bold
    background_color: E8F1F6
    font_color: $brand_deep
    border_bottom_width: 1
  body:
    stripe_background_color: FAFCFD
list:
  indent: 16
  item_spacing: 3
description_list:
  term_font_family: Noto Sans
  term_font_color: $brand_deep
toc:
  font_family: Noto Sans
  font_size: 9.5
  line_height: 1.35
  h2_font_style: bold
  h1_font_style: bold
  h1_font_color: $brand_deep
  dot_leader:
    font_color: BBBBBB
role:
  available:
    font_family: Noto Sans
    font_style: bold
    font_size: 0.8em
    font_color: 2E7D32
  sketch:
    font_family: Noto Sans
    font_style: bold
    font_size: 0.8em
    font_color: B26A00
  planned:
    font_family: Noto Sans
    font_style: bold
    font_size: 0.8em
    font_color: 6B7780
  term:
    font_style: italic
header:
  height: 0.5in
  font_family: Noto Sans
  font_size: 8
  font_color: $brand_muted
  border_color: D3E2EB
  border_width: 0.25
  vertical_align: bottom
  padding: [0, 0, 4, 0]
  recto:
    right:
      content: '{section-or-chapter-title}'
  verso:
    left:
      content: '{chapter-title}'
footer:
  height: 0.5in
  font_family: Noto Sans
  font_size: 8.5
  font_color: $brand_muted
  border_width: 0
  vertical_align: top
  padding: [6, 0, 0, 0]
  recto:
    left:
      content: '{document-title}'
    right:
      content: '{page-number}'
  verso:
    left:
      content: '{page-number}'
    right:
      content: '{document-title}'
footnotes:
  font_size: 8
  item_spacing: 2
index:
  column_gap: 18
