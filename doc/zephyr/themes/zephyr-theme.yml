# Nasdanika Zephyr Books theme for Asciidoctor PDF.
#
# Colors from Bootswatch Zephyr: 3459E6 for headings, links and the title band, 495057 for text,
# 212529 for titles, F8F9FA for code and sidebar backgrounds, DEE2E6 for rules, 6C757D for muted text.
# Zephyr's typeface is Inter, which is not bundled with Asciidoctor PDF, so the body and headings are
# in the bundled Noto Sans for now: a sans body sets the Zephyr Books apart from the SDK book, which
# is set in Noto Serif. Code is in M+ 1mn. All three are licensed under the SIL Open Font License.
#
# The trim size is the SDK book's, 189 x 246 mm (7.44 x 9.69 inches), and so is the 6-inch text
# block, because the Zephyr Books are code-heavy and a 96-character listing line fits it at 8.5 points.
#
# Every Zephyr Book has the same title page: a band of Zephyr blue with the Nasdanika logo at its top
# left, as on the web site, the module's name as the title, "A Nasdanika Zephyr Book" as the
# subtitle, and the version from the module's pom. The logo is on the title page only: in a book the
# title page is the web site's top left corner, and the running headers carry the chapter titles.
# At 0.6in the 205 pixel logo prints at about 340 dpi.
extends: default
font:
  catalog:
    merge: true
    Noto Sans:
      normal: GEM_FONTS_DIR/notosans-regular-subset.ttf
      bold: GEM_FONTS_DIR/notosans-bold-subset.ttf
      italic: GEM_FONTS_DIR/notosans-italic-subset.ttf
      bold_italic: GEM_FONTS_DIR/notosans-bold_italic-subset.ttf
  fallbacks: []
zephyr:
  primary: 3459E6
  primary_dark: 2A47B8
  text: 495057
  title: 212529
  light: F8F9FA
  rule: DEE2E6
  muted: 6C757D
  subtle: EBEFFC
page:
  size: [189mm, 246mm]
  margin: [0.7in, 0.72in, 0.7in, 0.72in]
  margin_inner: 0.845in
  margin_outer: 0.595in
base:
  font_family: Noto Sans
  font_color: $zephyr_text
  font_size: 9.5
  line_height_length: 13.5
  line_height: $base_line_height_length / $base_font_size
  text_align: left
  font_size_large: 12
  font_size_small: 8
vertical_rhythm: 10
horizontal_rhythm: 10
link:
  font_color: $zephyr_primary
codespan:
  font_color: AB296A
  font_size: 0.92em
heading:
  font_family: Noto Sans
  font_color: $zephyr_title
  font_style: bold
  h1_font_size: 26
  h2_font_size: 20
  h3_font_size: 14
  h4_font_size: 11.5
  h5_font_size: 10
  h6_font_size: 9.5
  line_height: 1.15
  margin_top: $vertical_rhythm * 0.9
  margin_bottom: $vertical_rhythm * 0.6
  min_height_after: $base_line_height_length * 3
  h1:
    font_color: $zephyr_primary
  h2:
    font_color: $zephyr_title
  h3:
    font_color: $zephyr_primary
    margin_top: $vertical_rhythm * 1.2
chapter:
  break_before: always
part:
  break_after: always
title_page:
  background_image: image:title-band.svg[fit=fill]
  text_align: left
  logo:
    image: image:../images/nasdanika-logo.png[pdfwidth=0.6in]
    top: 4%
    align: left
  title:
    top: 14%
    font_family: Noto Sans
    font_size: 34
    font_style: bold
    font_color: FFFFFF
    line_height: 1.1
  subtitle:
    font_family: Noto Sans
    font_size: 14
    font_style: normal
    font_color: FFFFFF
    line_height: 1.3
    margin_top: 14
  authors:
    margin_top: 160
    font_size: 13
    font_color: $zephyr_title
  revision:
    margin_top: 8
    font_size: 9.5
    font_color: $zephyr_muted
caption:
  font_family: Noto Sans
  font_size: 8.5
  font_style: italic
  font_color: $zephyr_muted
code:
  font_family: M+ 1mn
  font_size: 8.5
  line_height: 1.2
  padding: [7, 9, 7, 9]
  background_color: $zephyr_light
  border_color: $zephyr_rule
  border_radius: 3
  border_width: 0.5
  border_left_width: 2.5
  border_left_color: $zephyr_primary
conum:
  font_color: $zephyr_primary
  font_size: 9
admonition:
  column_rule_color: $zephyr_rule
  column_rule_width: 1
  padding: [3, 10, 3, 10]
  icon:
    note:
      name: fas-info-circle
      stroke_color: $zephyr_primary
      size: 20
    tip:
      name: fas-lightbulb
      stroke_color: 2E8540
      size: 20
    important:
      # Editor's notes for the author: [IMPORTANT,caption="Editor's note"]
      name: fas-pen-nib
      stroke_color: D97706
      size: 20
    caution:
      name: fas-exclamation-triangle
      stroke_color: B45309
      size: 20
    warning:
      name: fas-exclamation-circle
      stroke_color: B91C1C
      size: 20
sidebar:
  background_color: $zephyr_light
  border_color: $zephyr_rule
  border_width: 0.5
  border_radius: 3
  padding: [10, 12, 10, 12]
  title:
    font_family: Noto Sans
    font_color: $zephyr_title
    font_size: 10.5
    text_align: left
quote:
  font_size: 10
  font_color: $zephyr_muted
  border_left_color: $zephyr_primary
  border_left_width: 2
  cite:
    font_color: $zephyr_muted
table:
  font_size: 8.75
  border_color: $zephyr_rule
  grid_color: $zephyr_rule
  cell_padding: [3, 5, 3, 5]
  head:
    font_family: Noto Sans
    font_style: bold
    background_color: $zephyr_subtle
    font_color: $zephyr_title
    border_bottom_width: 1.25
    border_bottom_color: $zephyr_primary
  body:
    stripe_background_color: $zephyr_light
list:
  indent: 16
  item_spacing: 3
description_list:
  term_font_family: Noto Sans
  term_font_color: $zephyr_title
toc:
  font_family: Noto Sans
  font_size: 9.5
  line_height: 1.35
  h1_font_style: bold
  h1_font_color: $zephyr_primary
  h2_font_style: bold
  dot_leader:
    font_color: BBBBBB
role:
  available:
    font_family: Noto Sans
    font_style: bold
    font_size: 0.8em
    font_color: 2E8540
  sketch:
    font_family: Noto Sans
    font_style: bold
    font_size: 0.8em
    font_color: B26A00
  planned:
    font_family: Noto Sans
    font_style: bold
    font_size: 0.8em
    font_color: $zephyr_muted
  term:
    font_style: italic
header:
  height: 0.5in
  font_family: Noto Sans
  font_size: 8
  font_color: $zephyr_muted
  border_color: $zephyr_rule
  border_width: 0.25
  vertical_align: bottom
  padding: [0, 0, 4, 0]
  recto:
    right:
      content: '{section-or-chapter-title}'
  verso:
    left:
      content: '{chapter-title}'
footer:
  height: 0.5in
  font_family: Noto Sans
  font_size: 8.5
  font_color: $zephyr_muted
  border_width: 0
  vertical_align: top
  padding: [6, 0, 0, 0]
  recto:
    left:
      content: '{document-title}'
    right:
      content: '{page-number}'
  verso:
    left:
      content: '{page-number}'
    right:
      content: '{document-title}'
footnotes:
  font_size: 8
  item_spacing: 2
index:
  column_gap: 18
